<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mectro Support Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #000000;
    --bg: #0a0a0a;
    --panel: #111111;
    --line-dark: #2a2a2a;
    --white: #ffffff;
    --paper: #f7f7f5;
    --ink: #111111;
    --line-light: #d8d6d1;
    --muted: #7a7a7a;
    --muted-light: #8f8d88;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  ::selection { background: var(--white); color: var(--black); }

  a:focus-visible, button:focus-visible, textarea:focus-visible, .chip:focus-visible {
    outline: 2px solid var(--white);
    outline-offset: 2px;
  }

  /* ---------- Shell ---------- */
  .shell {
    max-width: 1180px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  header.brand {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px solid var(--line-dark);
    padding-bottom: 20px;
    margin-bottom: 40px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .brand-mark {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 0.02em;
  }
  .brand-mark span { color: var(--muted); font-weight: 400; }

  .brand-status {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--white);
    display: inline-block;
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }

  /* ---------- Grid ---------- */
  .grid {
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 32px;
  }
  @media (max-width: 860px) {
    .grid { grid-template-columns: 1fr; }
  }

  /* ---------- Input console ---------- */
  .console {
    background: var(--panel);
    border: 1px solid var(--line-dark);
    padding: 28px;
    position: sticky;
    top: 24px;
    align-self: start;
  }

  .eyebrow {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 14px;
  }

  .console h1 {
    font-family: 'Space Mono', monospace;
    font-size: 22px;
    line-height: 1.35;
    font-weight: 700;
    margin: 0 0 20px;
  }

  textarea#queryInput {
    width: 100%;
    background: var(--black);
    border: 1px solid var(--line-dark);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    line-height: 1.5;
    padding: 14px;
    resize: vertical;
    min-height: 96px;
    transition: border-color 0.15s ease;
  }
  textarea#queryInput:focus { border-color: var(--white); outline: none; }
  textarea#queryInput::placeholder { color: var(--muted); }

  .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 16px 0 22px;
  }
  .chip {
    font-family: 'Space Mono', monospace;
    font-size: 11.5px;
    background: transparent;
    color: var(--muted-light);
    border: 1px solid var(--line-dark);
    padding: 7px 11px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .chip:hover { border-color: var(--white); color: var(--white); }

  .send-btn {
    width: 100%;
    background: var(--white);
    color: var(--black);
    border: none;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 14px;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  .send-btn:hover:not(:disabled) { opacity: 0.85; }
  .send-btn:active:not(:disabled) { transform: scale(0.99); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .console-footnote {
    font-family: 'Space Mono', monospace;
    font-size: 10.5px;
    color: var(--line-dark);
    margin-top: 16px;
    line-height: 1.6;
  }

  /* ---------- Trace / output area ---------- */
  .trace {
    min-height: 420px;
  }

  .empty-state {
    height: 420px;
    border: 1px dashed var(--line-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 12.5px;
    text-align: center;
    padding: 24px;
  }

  .stub {
    background: var(--paper);
    color: var(--ink);
    padding: 22px 26px;
    margin-bottom: 3px;
    opacity: 0;
    transform: translateY(-10px);
    animation: print-in 0.45s ease forwards;
  }
  .stub:first-child { padding-top: 26px; }
  .stub-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid var(--line-light);
    padding-bottom: 10px;
    margin-bottom: 12px;
  }
  .stub-label {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .stub-num { color: var(--muted-light); font-weight: 400; margin-right: 8px; }
  .stub-meta {
    font-family: 'Space Mono', monospace;
    font-size: 10.5px;
    color: var(--muted-light);
  }
  .stub-body { font-size: 14.5px; line-height: 1.6; }
  .stub-body.mono {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-word;
    color: #333;
  }

  .stub.final {
    font-size: 15.5px;
    padding-bottom: 34px;
    position: relative;
  }
  .stub.final .stub-body { font-size: 16px; }

  /* torn receipt edge on the last stub */
  .tear {
    height: 14px;
    background:
      linear-gradient(-45deg, var(--paper) 8px, transparent 0),
      linear-gradient(45deg, var(--paper) 8px, transparent 0);
    background-position: bottom left;
    background-repeat: repeat-x;
    background-size: 16px 16px;
    margin-bottom: 24px;
  }

  @keyframes print-in {
    to { opacity: 1; transform: translateY(0); }
  }

  .loading-line {
    font-family: 'Space Mono', monospace;
    font-size: 12.5px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 0;
  }
  .cursor {
    width: 7px; height: 14px;
    background: var(--white);
    display: inline-block;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .error-stub {
    border: 1px solid var(--white);
    padding: 18px 22px;
    font-family: 'Space Mono', monospace;
    font-size: 12.5px;
    line-height: 1.6;
  }
  .error-stub .stub-label { margin-bottom: 8px; display: block; }
</style>
</head>
<body>
  <div class="shell">
    <header class="brand">
      <div class="brand-mark">MECTRO <span>/ SUPPORT CONSOLE</span></div>
      <div class="brand-status"><span class="dot"></span> AGENT PIPELINE ONLINE</div>
    </header>

    <div class="grid">
      <!-- Input console -->
      <div class="console">
        <p class="eyebrow">Customer Message</p>
        <h1>Ask Mectro<br>Support</h1>
        <textarea id="queryInput" placeholder="e.g. I would like to know your refund policy."></textarea>

        <div class="chip-row" id="chipRow">
          <button class="chip" data-q="I would like to know your refund policy.">Refund policy</button>
          <button class="chip" data-q="What's the status of my order ORD1001?">Order status</button>
          <button class="chip" data-q="I want to cancel my order ORD1002.">Cancel order</button>
          <button class="chip" data-q="My payment failed for order ORD1006.">Payment issue</button>
          <button class="chip" data-q="How long does shipping usually take?">Shipping info</button>
          <button class="chip" data-q="Can I return an item I already received?">Return policy</button>
        </div>

        <button class="send-btn" id="sendBtn">Send to support →</button>
        <p class="console-footnote">
          01 INTENT DETECTION → 02 MYSQL LOOKUP → 03 RESPONSE GENERATION<br>
          Three LangChain agents, one MySQL database.
        </p>
      </div>

      <!-- Trace / output -->
      <div class="trace" id="trace" aria-live="polite">
        <div class="empty-state" id="emptyState">
          Awaiting a customer message.<br>Pick an example or type your own, then send.
        </div>
      </div>
    </div>
  </div>

<script>
  const input = document.getElementById('queryInput');
  const sendBtn = document.getElementById('sendBtn');
  const trace = document.getElementById('trace');
  const emptyState = document.getElementById('emptyState');
  const chipRow = document.getElementById('chipRow');

  chipRow.addEventListener('click', (e) => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    input.value = btn.dataset.q;
    input.focus();
  });

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function prettyRetrieved(raw) {
    try {
      const parsed = JSON.parse(raw);
      return JSON.stringify(parsed, null, 2);
    } catch {
      return raw;
    }
  }

  function timestamp() {
    const d = new Date();
    return d.toTimeString().slice(0, 8);
  }

  function renderLoading() {
    trace.innerHTML = `
      <div class="loading-line">
        <span class="cursor"></span> contacting agent pipeline…
      </div>`;
  }

  function renderError(message) {
    trace.innerHTML = `
      <div class="error-stub">
        <span class="stub-label">⚠ PIPELINE ERROR</span>
        ${escapeHtml(message)}
      </div>`;
  }

  function renderResult(data) {
    trace.innerHTML = '';

    const stage3 = document.createElement('div');
    stage3.className = 'stub final';
    stage3.style.animationDelay = '0s';
    stage3.innerHTML = `
      <div class="stub-head">
        <span class="stub-label">Response to Customer</span>
        <span class="stub-meta">${timestamp()}</span>
      </div>
      <div class="stub-body">${escapeHtml(data.final_response)}</div>`;
    trace.appendChild(stage3);

    const tear = document.createElement('div');
    tear.className = 'tear';
    trace.appendChild(tear);
  }

  async function submitQuery() {
    const query = input.value.trim();
    if (!query) { input.focus(); return; }

    sendBtn.disabled = true;
    sendBtn.textContent = 'Sending…';
    renderLoading();

    try {
      const res = await fetch('/api/support/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ customer_query: query })
      });

      if (!res.ok) {
        const errBody = await res.json().catch(() => ({}));
        throw new Error(errBody.detail || `Request failed (${res.status})`);
      }

      const data = await res.json();
      renderResult(data);
    } catch (err) {
      renderError(err.message || 'Could not reach the support pipeline. Is the API running?');
    } finally {
      sendBtn.disabled = false;
      sendBtn.textContent = 'Send to support →';
    }
  }

  sendBtn.addEventListener('click', submitQuery);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) submitQuery();
  });
</script>
</body>
</html>
